<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Tray - Admin</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #050505;

            color: white;

            font-family: Arial, sans-serif;

            min-height: 100vh;

        }


        header {

            text-align: center;

            padding: 30px 15px;

            border-bottom: 2px solid #333;

        }


        h1 {

            margin: 0;

            font-size: 38px;

        }


        .container {

            width: 90%;

            max-width: 650px;

            margin: 40px auto;

        }


        .card {

            background: #111;

            border: 1px solid #333;

            border-radius: 12px;

            padding: 30px;

        }


        .field {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #aaa;

            font-size: 17px;

        }


        input,
        select {

            width: 100%;

            padding: 14px;

            background: #050505;

            border: 1px solid #444;

            border-radius: 7px;

            color: white;

            font-size: 18px;

        }


        button {

            width: 100%;

            padding: 16px;

            background: #222;

            color: white;

            border: 1px solid #555;

            border-radius: 7px;

            font-size: 20px;

            cursor: pointer;

        }


        button:hover {

            background: #333;

        }


        .result {

            margin-top: 20px;

            padding: 15px;

            border-radius: 7px;

            display: none;

            text-align: center;

        }


        .success {

            background: #12351f;

            color: #7dff9b;

        }


        .error {

            background: #351212;

            color: #ff8585;

        }


    </style>

</head>


<body>


<header>

    <h1>GOLD TRAY UPDATE</h1>

</header>


<div class="container">


    <div class="card">


        <form id="updateForm">


            <div class="field">

                <label>
                    رقم الطريحة
                </label>

                <input
                    type="text"
                    id="trayNumber"
                    placeholder="مثال: 1025"
                    required
                >

            </div>


            <div class="field">

                <label>
                    القسم الحالي
                </label>

                <select id="department" required>

                    <option value="">
                        اختر القسم
                    </option>

                    <option value="CASTING">
                        CASTING
                    </option>

                    <option value="POLISHING">
                        POLISHING
                    </option>

                    <option value="FINISHING">
                        FINISHING
                    </option>

                    <option value="QC">
                        QC
                    </option>

                    <option value="PACKING">
                        PACKING
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    الوزن الداخل (g)
                </label>

                <input
                    type="number"
                    id="weightIn"
                    step="0.01"
                    min="0"
                    placeholder="مثال: 130.00"
                    required
                >

            </div>


            <div class="field">

                <label>
                    الوزن الخارج (g)
                </label>

                <input
                    type="number"
                    id="weightOut"
                    step="0.01"
                    min="0"
                    placeholder="مثال: 128.80"
                    required
                >

            </div>


            <button type="submit">

                UPDATE TRAY

            </button>


        </form>


        <div
            id="result"
            class="result">
        </div>


    </div>


</div>



<script>


const form =
    document.getElementById("updateForm");


const result =
    document.getElementById("result");



form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        result.style.display = "none";


        const trayNumber =
            document.getElementById("trayNumber").value.trim();


        const department =
            document.getElementById("department").value;


        const weightIn =
            Number(
                document.getElementById("weightIn").value
            );


        const weightOut =
            Number(
                document.getElementById("weightOut").value
            );



        try {


            const response =
                await fetch(
                    "/api/trays/update",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            tray_number:
                                trayNumber,

                            department:
                                department,

                            weight_in:
                                weightIn,

                            weight_out:
                                weightOut

                        })

                    }
                );



            const data =
                await response.json();



            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "حدث خطأ"
                );

            }



            result.className =
                "result success";


            result.innerHTML = `

                تم تحديث الطريحة بنجاح ✅

                <br><br>

                الطريحة:
                <strong>
                    ${data.tray_number}
                </strong>

                <br>

                الوزن الداخل:
                <strong>
                    ${data.weight_in.toFixed(2)} g
                </strong>

                <br>

                الوزن الخارج:
                <strong>
                    ${data.weight_out.toFixed(2)} g
                </strong>

                <br>

                الخسارة:
                <strong>
                    ${data.loss.toFixed(2)} g
                </strong>

            `;


            result.style.display =
                "block";


            form.reset();


        } catch (error) {


            result.className =
                "result error";


            result.textContent =
                error.message;


            result.style.display =
                "block";

        }

    }
);


</script>


</body>

</html>
