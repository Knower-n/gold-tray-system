<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Tray - Admin</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }


        header {
            text-align: center;
            padding: 30px 15px;
            border-bottom: 2px solid #333;
        }


        h1 {
            margin: 0;
            font-size: 38px;
        }


        .subtitle {
            margin-top: 8px;
            color: #888;
            font-size: 15px;
        }


        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }


        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
        }


        .field {
            margin-bottom: 20px;
        }


        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 17px;
        }


        input,
        select {

            width: 100%;

            padding: 14px;

            background: #050505;

            border: 1px solid #444;

            border-radius: 7px;

            color: white;

            font-size: 18px;

            outline: none;
        }


        input:focus,
        select:focus {
            border-color: #777;
        }


        select option {
            background: #111;
            color: white;
        }


        button {

            width: 100%;

            padding: 16px;

            background: #222;

            color: white;

            border: 1px solid #555;

            border-radius: 7px;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #333;
        }


        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .result {

            margin-top: 20px;

            padding: 18px;

            border-radius: 7px;

            display: none;

            text-align: center;

            line-height: 1.8;
        }


        .success {

            background: #12351f;

            color: #7dff9b;

            border: 1px solid #245f35;
        }


        .error {

            background: #351212;

            color: #ff8585;

            border: 1px solid #672424;
        }


        .loading {
            opacity: 0.6;
        }


        .info {

            margin-top: 25px;

            padding: 15px;

            background: #0d0d0d;

            border: 1px solid #292929;

            border-radius: 7px;

            color: #888;

            font-size: 14px;

            text-align: center;

            line-height: 1.7;
        }


        .loss-preview {

            display: none;

            margin-top: -5px;

            margin-bottom: 20px;

            padding: 12px;

            background: #181818;

            border: 1px solid #333;

            border-radius: 7px;

            text-align: center;

            color: #aaa;

        }


        .loss-value {

            color: #fff;

            font-weight: bold;

            font-size: 20px;
        }


        @media (max-width: 700px) {

            h1 {
                font-size: 28px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }

            input,
            select {
                font-size: 16px;
            }

            button {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        GOLD TRAY UPDATE
    </h1>

    <div class="subtitle">
        تحديث حركة الطريحة
    </div>

</header>



<div class="container">


    <div class="card">


        <form id="updateForm">


            <!-- رقم الطريحة -->

            <div class="field">

                <label for="trayNumber">
                    رقم الطريحة
                </label>

                <input
                    type="text"
                    id="trayNumber"
                    placeholder="مثال: 1025"
                    autocomplete="off"
                    required
                >

            </div>



            <!-- القسم -->

            <div class="field">

                <label for="department">
                    القسم الحالي
                </label>

                <select
                    id="department"
                    required
                >

                    <option value="">
                        اختر القسم
                    </option>

                    <option value="تازجة وتشطيب">
                        تازجة وتشطيب
                    </option>

                    <option value="جلا">
                        جلا
                    </option>

                    <option value="بنترياج">
                        بنترياج
                    </option>

                    <option value="تربو">
                        تربو
                    </option>

                    <option value="دمغة">
                        دمغة
                    </option>

                    <option value="سنفرة">
                        سنفرة
                    </option>

                </select>

            </div>



            <!-- الوزن الداخل -->

            <div class="field">

                <label for="weightIn">
                    الوزن الداخل (g)
                </label>

                <input
                    type="number"
                    id="weightIn"
                    step="0.01"
                    min="0"
                    placeholder="مثال: 130.00"
                    required
                >

            </div>



            <!-- الوزن الخارج -->

            <div class="field">

                <label for="weightOut">
                    الوزن الخارج (g)
                </label>

                <input
                    type="number"
                    id="weightOut"
                    step="0.01"
                    min="0"
                    placeholder="مثال: 128.80"
                    required
                >

            </div>



            <!-- عرض الخسارة -->

            <div
                id="lossPreview"
                class="loss-preview"
            >

                الخسارة:

                <span
                    id="lossValue"
                    class="loss-value"
                >
                    0.00 g
                </span>

            </div>



            <!-- زر التحديث -->

            <button
                type="submit"
                id="updateButton"
            >

                UPDATE TRAY

            </button>


        </form>



        <!-- نتيجة العملية -->

        <div
            id="result"
            class="result"
        >
        </div>



        <div class="info">

            الوزن الداخل − الوزن الخارج = الخسارة

            <br>

            بعد التحديث سيتم تغيير القسم والوزن الموجود
            وتسجيل الحركة في تاريخ الطريحة.

        </div>


    </div>


</div>



<script>


// ==========================================
// العناصر
// ==========================================

const form =
    document.getElementById("updateForm");

const result =
    document.getElementById("result");

const updateButton =
    document.getElementById("updateButton");

const weightInInput =
    document.getElementById("weightIn");

const weightOutInput =
    document.getElementById("weightOut");

const lossPreview =
    document.getElementById("lossPreview");

const lossValue =
    document.getElementById("lossValue");



// ==========================================
// حساب الخسارة أثناء الكتابة
// ==========================================

function calculateLoss() {

    const weightIn =
        Number(weightInInput.value);

    const weightOut =
        Number(weightOutInput.value);


    if (
        Number.isFinite(weightIn) &&
        Number.isFinite(weightOut) &&
        weightIn >= 0 &&
        weightOut >= 0 &&
        weightOut <= weightIn
    ) {

        const loss =
            weightIn - weightOut;

        lossValue.textContent =
            loss.toFixed(2) + " g";

        lossPreview.style.display =
            "block";

    } else {

        lossPreview.style.display =
            "none";

    }

}


weightInInput.addEventListener(
    "input",
    calculateLoss
);


weightOutInput.addEventListener(
    "input",
    calculateLoss
);



// ==========================================
// إظهار النتيجة
// ==========================================

function showResult(
    message,
    type
) {

    result.className =
        "result " + type;

    result.innerHTML =
        message;

    result.style.display =
        "block";

}



// ==========================================
// إرسال التحديث
// ==========================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // إخفاء النتيجة القديمة

        result.style.display =
            "none";


        // البيانات

        const trayNumber =
            document
                .getElementById("trayNumber")
                .value
                .trim();


        const department =
            document
                .getElementById("department")
                .value;


        const weightIn =
            Number(
                weightInInput.value
            );


        const weightOut =
            Number(
                weightOutInput.value
            );



        // التحقق

        if (!trayNumber) {

            showResult(
                "من فضلك أدخل رقم الطريحة",
                "error"
            );

            return;

        }


        if (!department) {

            showResult(
                "من فضلك اختر القسم",
                "error"
            );

            return;

        }


        if (
            !Number.isFinite(weightIn) ||
            !Number.isFinite(weightOut)
        ) {

            showResult(
                "من فضلك أدخل الأوزان بشكل صحيح",
                "error"
            );

            return;

        }


        if (
            weightIn < 0 ||
            weightOut < 0
        ) {

            showResult(
                "الوزن لا يمكن أن يكون بالسالب",
                "error"
            );

            return;

        }


        if (weightOut > weightIn) {

            showResult(
                "الوزن الخارج لا يمكن أن يكون أكبر من الوزن الداخل",
                "error"
            );

            return;

        }



        // تعطيل الزر أثناء الإرسال

        updateButton.disabled =
            true;

        updateButton.textContent =
            "جاري التحديث...";



        try {


            // إرسال البيانات للـ API

            const response =
                await fetch(
                    "/api/trays/update",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                tray_number:
                                    trayNumber,

                                department:
                                    department,

                                weight_in:
                                    weightIn,

                                weight_out:
                                    weightOut

                            })

                    }
                );



            const data =
                await response.json();



            // لو حصل خطأ

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "حدث خطأ أثناء تحديث الطريحة"
                );

            }



            // نجاح

            showResult(

                `
                    <strong>
                        تم تحديث الطريحة بنجاح
                    </strong>

                    <br><br>

                    رقم الطريحة:
                    <strong>
                        ${escapeHTML(data.tray_number)}
                    </strong>

                    <br>

                    الوزن الداخل:
                    <strong>
                        ${Number(data.weight_in).toFixed(2)} g
                    </strong>

                    <br>

                    الوزن الخارج:
                    <strong>
                        ${Number(data.weight_out).toFixed(2)} g
                    </strong>

                    <br>

                    الخسارة:
                    <strong>
                        ${Number(data.loss).toFixed(2)} g
                    </strong>

                    <br>

                    القسم:
                    <strong>
                        ${escapeHTML(department)}
                    </strong>
                `,

                "success"

            );



            // تفريغ الفورم

            form.reset();


            lossPreview.style.display =
                "none";



        } catch (error) {


            console.error(error);


            showResult(

                error.message ||
                "حدث خطأ غير معروف",

                "error"

            );


        } finally {


            // إعادة تفعيل الزر

            updateButton.disabled =
                false;

            updateButton.textContent =
                "UPDATE TRAY";

        }

    }
);



// ==========================================
// حماية النصوص
// ==========================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


</script>


</body>

</html>
