<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Tray Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 25px 15px;
            border-bottom: 2px solid #333;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .subtitle {
            margin-top: 8px;
            color: #aaa;
            font-size: 16px;
        }

        .board {
            width: 95%;
            margin: 30px auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #151515;
            color: #d6d6d6;
            font-size: 20px;
            padding: 18px;
            border-bottom: 2px solid #444;
        }

        td {
            padding: 20px 15px;
            text-align: center;
            font-size: 24px;
            border-bottom: 1px solid #292929;
        }

        tr {
            transition: 0.3s;
        }

        tr:hover {
            background: #151515;
        }

        .tray-number {
            font-weight: bold;
            font-size: 28px;
        }

        .department {
            font-weight: bold;
        }

        .weight {
            font-weight: bold;
            font-size: 26px;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .title {
                font-size: 28px;
            }

            td {
                font-size: 18px;
            }

            th {
                font-size: 16px;
            }

            .tray-number,
            .weight {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="title">
        GOLD TRAY BOARD
    </div>

    <div class="subtitle">
        CURRENT TRAY STATUS
    </div>

</header>


<div class="board">

    <table>

        <thead>

            <tr>
                <th>رقم الطريحة</th>
                <th>اسم الطريحة</th>
                <th>القسم الحالي</th>
                <th>الوزن الموجود</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td class="tray-number">1025</td>
                <td>Diamond Ring</td>
                <td class="department">POLISHING</td>
                <td class="weight">125.40 g</td>
            </tr>

            <tr>
                <td class="tray-number">1026</td>
                <td>Bracelet 01</td>
                <td class="department">CASTING</td>
                <td class="weight">238.70 g</td>
            </tr>

            <tr>
                <td class="tray-number">1027</td>
                <td>Necklace</td>
                <td class="department">FINISHING</td>
                <td class="weight">94.20 g</td>
            </tr>

        </tbody>

    </table>

</div>


<div class="footer">

    Last Update: <span id="time"></span>

</div>


<script>

    function updateTime() {

        const now = new Date();

        document.getElementById("time").textContent =
            now.toLocaleString("en-GB");

    }

    updateTime();

    setInterval(updateTime, 1000);

</script>

</body>
</html>
