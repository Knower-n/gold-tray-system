<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Tray Board</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 25px 15px;
            border-bottom: 2px solid #333;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .subtitle {
            margin-top: 8px;
            color: #aaa;
            font-size: 16px;
        }

        .board {
            width: 95%;
            margin: 30px auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #151515;
            color: #d6d6d6;
            font-size: 20px;
            padding: 18px;
            border-bottom: 2px solid #444;
        }

        td {
            padding: 20px 15px;
            text-align: center;
            font-size: 24px;
            border-bottom: 1px solid #292929;
        }

        tr {
            transition: 0.3s;
        }

        tr:hover {
            background: #151515;
        }

        .tray-number {
            font-weight: bold;
            font-size: 28px;
        }

        .department {
            font-weight: bold;
        }

        .weight {
            font-weight: bold;
            font-size: 26px;
        }

        .status {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .title {
                font-size: 28px;
            }

            td {
                font-size: 18px;
            }

            th {
                font-size: 16px;
            }

            .tray-number,
            .weight {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="title">
        GOLD TRAY BOARD
    </div>

    <div class="subtitle">
        CURRENT TRAY STATUS
    </div>

</header>



<div class="board">

    <table>

        <thead>

            <tr>

                <th>رقم الطريحة</th>

                <th>اسم الطريحة</th>

                <th>القسم الحالي</th>

                <th>الوزن الموجود</th>

            </tr>

        </thead>


        <tbody id="trayTable">

            <tr>

                <td colspan="4" class="status">
                    Loading...
                </td>

            </tr>

        </tbody>

    </table>

</div>



<div class="footer">

    Last Update:
    <span id="time"></span>

</div>



<script>


// ========================================
// تحميل الطرائح من قاعدة البيانات
// ========================================

async function loadTrays() {

    const table = document.getElementById("trayTable");

    try {

        const response = await fetch("/api/trays");

        if (!response.ok) {

            throw new Error("Failed to load trays");

        }

        const trays = await response.json();


        // مفيش طرائح

        if (trays.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="4" class="status">
                        لا توجد طرائح
                    </td>
                </tr>
            `;

            return;
        }


        // إنشاء الصفوف

        table.innerHTML = trays.map(tray => `

            <tr>

                <td class="tray-number">
                    ${escapeHTML(tray.tray_number)}
                </td>

                <td>
                    ${escapeHTML(tray.tray_name)}
                </td>

                <td class="department">
                    ${escapeHTML(tray.current_department)}
                </td>

                <td class="weight">
                    ${Number(tray.current_weight).toFixed(2)} g
                </td>

            </tr>

        `).join("");


    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="4" class="status error">
                    حدث خطأ في تحميل البيانات
                </td>
            </tr>
        `;

    }

}



// ========================================
// حماية عرض النصوص
// ========================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ========================================
// الساعة
// ========================================

function updateTime() {

    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleString("en-GB");

}



// ========================================
// تشغيل الصفحة
// ========================================

loadTrays();

updateTime();



// ========================================
// تحديث البيانات تلقائيًا كل 5 ثواني
// ========================================

setInterval(loadTrays, 5000);

setInterval(updateTime, 1000);


</script>


</body>

</html>
